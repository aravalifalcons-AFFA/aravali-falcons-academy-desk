<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style id="supabase-auth-styles">
.auth-wrap{min-height:70vh;display:grid;place-items:center;padding:28px 16px}
.auth-card{width:min(100%,430px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 34px rgba(35,20,24,.08)}
.auth-card h2{font-family:var(--display);font-size:30px;margin:0 0 8px;color:var(--ink)}
.auth-card p{color:var(--muted);margin:0 0 22px}
.auth-card label{display:block;font-weight:600;margin:14px 0 6px}
.auth-card input{display:block;width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.auth-card button{width:100%;margin-top:18px;padding:12px 16px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.auth-card button:disabled{opacity:.65;cursor:wait}
.auth-error{color:var(--bad);font-size:14px;min-height:20px;margin-top:12px}
.auth-brand{font-family:var(--display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
</style>

</head><body>
<title>Academy Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: slate header with logo, academy name and center switcher; maroon touchline tab bar; content column below.
   Palette comes from the logo: maroon, slate grey, silver, white. */
:root{
  --bg:#F4F2F2; --surface:#FFFFFF; --surface2:#ECE8E9; --ink:#241B1D; --muted:#675D60; --line:#DDD6D8;
  --accent:#892934; --accent-ink:#FFFFFF; --accent-soft:#F2DEE1;
  --ok:#3E444A; --ok-soft:#DFE2E5; --warn:#5C4F52; --warn-soft:#E9E5E6; --bad:#892934; --bad-soft:#F3D8DC;
  --p-bg:#4F555C; --p-ink:#FFFFFF; --a-bg:#892934; --a-ink:#FFFFFF; --l-bg:#B9BDC1; --l-ink:#241B1D;
  --bar:#4A5057; --bar-ink:#FFFFFF; --bar-muted:#C5C9CD;

}

    --bar:#0F0C0D; --bar-ink:#F1EAEB; --bar-muted:#A89DA0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161213; --surface:#211B1D; --surface2:#2C2427; --ink:#F1EAEB; --muted:#AA9FA2; --line:#3B3235;
  --accent:#D0707C; --accent-ink:#1C0D10; --accent-soft:#3A2327;
  --ok:#B4BAC0; --ok-soft:#2C3034; --warn:#CFC3C6; --warn-soft:#352C2F; --bad:#E58C97; --bad-soft:#43232A;
  --p-bg:#AEB4BA; --p-ink:#161213; --a-bg:#D0707C; --a-ink:#1C0D10; --l-bg:#6E6A6C; --l-ink:#F1EAEB;

.brand small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bar-muted)}
.brand h1{font-size:clamp(22px,5.4vw,32px);letter-spacing:.03em;overflow-wrap:anywhere}
.iconbtn{background:transparent;border:1px solid color-mix(in srgb,var(--bar-ink) 30%,transparent);color:var(--bar-ink);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px;flex:none}
.iconbtn:hover{background:color-mix(in srgb,var(--bar-ink) 12%,transparent)}
.cbar{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:14px}
.cbar button{background:transparent;border:1px solid color-mix(in srgb,var(--bar-ink) 30%,transparent);color:var(--bar-muted);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;min-height:36px}
.cbar button:hover{color:var(--bar-ink)}
.cbar button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:3px solid var(--accent)}

<div id="app"><div class="wrap" style="padding-block:40px;color:var(--muted)">Loading your academy…</div></div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<day)d.setDate(0);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const monthLabel=m=>parse(m+'-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const dateLabel=s=>parse(s).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
const dShort=s=>parse(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n||0);
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const time12=t=>{if(!t)return '';const a=t.split(':').map(Number);return ((a[0]%12)||12)+':'+pad(a[1])+' '+(a[0]>=12?'PM':'AM')};
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const ageOf=dob=>{if(!dob)return null;const b=parse(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};

const CENTERS=[{id:'c_stx',name:"St Xavier's",short:"St Xavier's"},{id:'c_tulip',name:'Tulip',short:'Tulip'}];
const centerName=id=>(CENTERS.find(c=>c.id===id)||{}).name||'';
const centerShort=id=>(CENTERS.find(c=>c.id===id)||{}).short||'';
const DEFAULT_NAME='ARAVALI FALCONS FOOTBALL ACADEMY';
const PLANS=[3,6,12];

const S={students:[],batches:[],coaches:[],plans:[],att:{},catt:{},cancellations:{},legacyCancellations:{},attendanceCancellations:{},pays:[],settings:{},attNormalized:[],loaded:{},ready:false,dbOk:true};
function getPref(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function setPref(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const UI={center:CENTERS.some(c=>c.id===getPref('ad_center',''))?getPref('ad_center',''):'all',attCenter:'',attDate:today(),attBatch:'',attMode:'students',q:'',stuBatch:'',feeMonth:today().slice(0,7),feeFilter:'all'};
let db=null;

/* ---------- storage helpers ---------- */
let queue=Promise.resolve();
const enqueue=fn=>{const p=queue.then(fn);queue=p.catch(()=>{});return p};
function errMsg(e){const c=e&&e.code;if(c==='quota_exceeded')return 'Storage limit reached. Remove old records to add more.';if(c==='invalid_argument')return 'Could not save. You may have view-only access.';if(c==='revoked')return 'Access to this page changed. Reload to continue.';return 'Could not save. Check your connection and try again.'}
async function save(fn){try{await enqueue(fn);return true}catch(e){toast(errMsg(e));return false}}
const putDoc=(coll,id,data)=>{const c={};for(const k in data)if(data[k]!==undefined&&k!=='id')c[k]=data[k];return save(async()=>{const ref=id?db.doc(coll+'/'+id):db.collection(coll).doc();await ref.set(c)})};
const delDoc=(coll,id)=>save(async()=>{await db.doc(coll+'/'+id).delete()});
let toastT;
function toast(msg){const r=$('#toastRoot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>{r.innerHTML=''},3400)}

/* ---------- derived data ---------- */
const inC=x=>UI.center==='all'||x.centerId===UI.center;
const stuList=()=>S.students.filter(inC);
const batchList=()=>S.batches.filter(inC);
const coachIn=(c,cid)=>(c.centerIds||[]).includes(cid);
const coachList=()=>S.coaches.filter(c=>UI.center==='all'||coachIn(c,UI.center));
const studentStatus=s=>s&&s.status==='paused'&&s.pauseEnd&&s.pauseEnd<today()?'active':(s&&s.status)||'active';
const activeStudents=()=>stuList().filter(s=>studentStatus(s)==='active');
const batchName=id=>{const b=S.batches.find(x=>x.id===id);return b?b.name:'No batch'};
const coachName=id=>{const c=S.coaches.find(x=>x.id===id);return c?c.name:''};
const academyName=()=>S.settings.name||DEFAULT_NAME;
const graceDays=()=>{const n=Number(S.settings.dueDays);return n>=0&&S.settings.dueDays!==undefined&&S.settings.dueDays!==''?n:7};
const planPrice=(m,cid)=>Number(S.settings['price'+m+'_'+(cid||defCenter())]??S.settings['price'+m])||0;
const attCenter=()=>UI.center!=='all'?UI.center:(UI.attCenter||CENTERS[0].id);
const planBaseEnd=p=>addDays(addMonths(p.start,p.months),-1);
const nextTrainingDay=(date,days)=>{let d=date;for(let i=0;i<14;i++){d=addDays(d,1);if((days||[]).includes(parse(d).getDay()))return d}return addDays(date,1)};
const planEnd=p=>{let end=planBaseEnd(p);const st=S.students.find(x=>x.id===p.studentId),bt=st&&S.batches.find(x=>x.id===st.batchId);if(bt&&(bt.days||[]).length){const days=Object.values(S.cancellations).filter(c=>c&&!c.restoredAt&&['rain','pollution','coach unavailable'].includes(String(c.reason||'').toLowerCase())&&c.batchId===bt.id&&c.date>=p.start).sort((a,b)=>String(a.date).localeCompare(String(b.date)));for(const c of days){if(c.date<=end)end=nextTrainingDay(end,bt.days)}}const pauses=(st&&st.pauseHistory)||[];for(const pause of pauses){if(pause.start&&pause.end&&pause.start<=end&&pause.end>=p.start){const from=pause.start<p.start?p.start:pause.start,to=pause.end>end?end:pause.end;const days=Math.max(0,diffDays(to,from)+1);end=addDays(end,days)}}return end};
const planPaid=p=>S.pays.filter(x=>x.planId===p.id).reduce((a,x)=>a+(Number(x.amount)||0),0);
function currentPlan(sid){let best=null;S.plans.forEach(p=>{if(p.studentId===sid&&(!best||p.start>best.start))best=p});return best}
function feeRow(st){
  const plan=currentPlan(st.id);
  if(!plan)return {st,plan:null,due:0,paid:0,bal:0,status:'noplan',life:'none'};
  const t=today(),due=Number(plan.fee)||0,paid=planPaid(plan),bal=Math.max(0,due-paid),end=planEnd(plan),left=diffDays(end,t);
  const status=due===0?'nofee':bal===0?'paid':t>addDays(plan.start,graceDays())?'overdue':paid>0?'partial':'pending';
  const life=left<0?'expired':left<=14?'expiring':'active';
  return {st,plan,due,paid,bal,end,left,status,life};
}
function attPct(sid){
  const lo=addDays(today(),-60);let m=0,p=0;
  for(const d in S.att){if(d<lo)continue;const v=S.att[d][sid];if(v==='P'||v==='L'){m++;p++}else if(v==='A')m++}
  return m?Math.round(p/m*100):null;
}
function coachDays(cid,month){const seen={};for(const k in S.catt){if(k.slice(0,7)===month){const v=S.catt[k][cid];if(v==='P'||v==='L')seen[k.slice(0,10)]=1}}return Object.keys(seen).length}
const hasSample=()=>[S.students,S.batches,S.coaches,S.pays,S.plans].some(a=>a.some(x=>x.sample))||Object.keys(S._attSample||{}).length>0;
const noPrices=()=>CENTERS.every(c=>!PLANS.some(m=>planPrice(m,c.id)));

/* ---------- subscriptions ---------- */
let raf=0;const schedule=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})};
function subColl(name,path,apply){
  db.collection(path).onSnapshot(snap=>{apply(snap);S.loaded[name]=true;checkReady();schedule()},()=>{S.dbOk=false;S.ready=true;schedule()});
}
const rows=snap=>snap.docs.map(d=>Object.assign({id:d.id},d.data()));
const byName=(a,b)=>String(a.name).localeCompare(String(b.name));
function checkReady(){const needed=currentRole==='coach'?['students','batches','coaches','attNormalized','cancellations']:['students','batches','coaches','plans','att','catt','cancellations','pays','settings'];if(!S.ready&&needed.every(k=>S.loaded[k]))S.ready=true}
function loadNormalizedAttendance(){const refresh=async()=>{const {data,error}=await sb.from('academy_attendance').select('attendance_date,student_id,status,updated_at');if(error){S.dbOk=false;S.ready=true;schedule();return}S.attNormalized=data||[];S.loaded.attNormalized=true;checkReady();schedule()};refresh();const ch=sb.channel('affa-attendance-live').on('postgres_changes',{event:'*',schema:'public',table:'academy_attendance'},refresh).subscribe();activeChannels.add(ch)}
function startSubs(){
  subColl('students','students',s=>{S.students=rows(s).sort(byName)});
  subColl('batches','batches',s=>{S.batches=rows(s).sort(byName)});
  subColl('coaches','coaches',s=>{S.coaches=rows(s).sort(byName)});
  subColl('cancellations','sessionCancellations',s=>{S.legacyCancellations={};s.docs.forEach(d=>{S.legacyCancellations[d.id]=d.data()});S.cancellations=Object.assign({},S.legacyCancellations,S.attendanceCancellations)});
  loadNormalizedAttendance();
  if(currentRole==='coach')subColl('attCancel','attendance',s=>{S.attendanceCancellations={};s.docs.forEach(d=>{const v=d.data();Object.entries(v.cancelledBatches||{}).forEach(([bid,c])=>{S.attendanceCancellations[d.id+'_'+bid]=Object.assign({date:d.id,batchId:bid},c)})}) ;S.cancellations=Object.assign({},S.legacyCancellations,S.attendanceCancellations)});
  if(currentRole!=='coach'){
    subColl('plans','plans',s=>{S.plans=rows(s)});
    subColl('att','attendance',s=>{S.att={};S._attSample={};S.attendanceCancellations={};s.docs.forEach(d=>{const v=d.data();S.att[d.id]=v.records||{};if(v.sample)S._attSample[d.id]=true;Object.entries(v.cancelledBatches||{}).forEach(([bid,c])=>{S.attendanceCancellations[d.id+'_'+bid]=Object.assign({date:d.id,batchId:bid},c)})});S.cancellations=Object.assign({},S.legacyCancellations,S.attendanceCancellations)});
    subColl('catt','coachAttendance',s=>{S.catt={};s.docs.forEach(d=>{const v=d.data();S.catt[d.id]=v.records||{};if(v.sample)S._attSample[d.id+'_c']=true})});
    subColl('pays','payments',s=>{S.pays=rows(s)});
    db.doc('settings/main').onSnapshot(snap=>{S.settings=snap.exists?snap.data():{};S.loaded.settings=true;checkReady();schedule()},()=>{S.dbOk=false;S.ready=true;schedule()});
  }
  setTimeout(()=>{if(!S.ready){S.ready=true;schedule()}},5000);
}

/* ---------- views ---------- */
const ROUTES=[['today','Today'],['attendance','Attendance'],['students','Students'],['batches','Batches'],['coaches','Coaches'],['fees','Fees']];
let currentCoachId=null;
const isCoach=()=>currentRole==='coach';
const coachBatchIds=()=>S.batches.filter(b=>(b.coachIds||[]).includes(currentCoachId)).map(b=>b.id);
const route=()=>{const h=location.hash.slice(1);return ROUTES.some(r=>r[0]===h)?h:'today'};
const scopeLabel=()=>UI.center==='all'?'Both centers':centerName(UI.center);
const cTag=x=>UI.center==='all'&&x.centerId?' · '+esc(centerShort(x.centerId)):'';

function feeChips(r){
  if(!r.plan)return '<span class="chip warn">No plan</span>';
  const pay={paid:'Paid',partial:'Part paid',pending:'Payment due',overdue:'Overdue',nofee:'No fee set'}[r.status];
  const life=r.life==='expired'?'<span class="chip expired">Plan ended</span>':r.life==='expiring'?'<span class="chip expiring">Ends in '+r.left+' day'+(r.left===1?'':'s')+'</span>':'';
  return '<span class="chip '+r.status+'">'+pay+'</span>'+life;
}
function priceBanner(){return noPrices()?'<div class="banner"><span>Set your 3, 6 and 12 month plan prices so fees fill in automatically.</span><button class="btn sm" data-act="settings">Open settings</button></div>':''}
function emptySetup(){
  return '<div class="panel empty"><h3>Set up '+esc(scopeLabel())+'</h3><p>Add a batch first, then your students and coaches. Or load sample data to try everything out.</p>'+
  '<div class="row"><button class="btn primary" data-act="addbatch">Add a batch</button><button class="btn" data-act="addstu">Add a student</button><button class="btn" data-act="addcoach">Add a coach</button><button class="btn ghost" data-act="sample">Load sample data</button></div></div>';
}

function viewToday(){
  const t=today(),cur=t.slice(0,7),dow=parse(t).getDay();
  const act=activeStudents(),ar=S.att[t]||{};
  const pres=act.filter(s=>ar[s.id]==='P'||ar[s.id]==='L').length,marked=act.filter(s=>ar[s.id]).length;
  const cs=UI.center==='all'?CENTERS.map(c=>c.id):[UI.center];let cp=0,ct=0;
  cs.forEach(cid=>{const rec=S.catt[t+'_'+cid]||{};S.coaches.filter(c=>coachIn(c,cid)).forEach(c=>{ct++;if(rec[c.id]==='P'||rec[c.id]==='L')cp++})});
  const ids={};act.forEach(s=>ids[s.id]=1);
  const collected=S.pays.filter(p=>ids[p.studentId]&&String(p.date).slice(0,7)===cur).reduce((a,p)=>a+(Number(p.amount)||0),0);
  const fr=act.map(feeRow);
  const open=fr.filter(r=>r.plan&&r.bal>0);

      (r.life!=='active'?'<button class="btn sm'+(r.life==='expired'?' primary':'')+'" data-act="renew" data-id="'+esc(r.st.id)+'">Renew</button>':'');
    return '<div class="item"><div class="grow"><div class="name">'+esc(r.st.name)+'</div><div class="sub">'+esc(batchName(r.st.batchId))+cTag(r.st)+'</div><div class="sub">'+esc(sub)+'</div></div><div class="end">'+feeChips(r)+btns+'</div></div>';

function gather(fields){
  const o={};
  fields.forEach(f=>{const el=document.getElementById('f_'+f.k);if(!el)return;
    if(f.type==='days')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>Number(i.value));
    else if(f.type==='multi')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);
    else if(f.type==='number')o[f.k]=el.value===''?0:Number(el.value);
    else o[f.k]=el.value.trim()});
  return o;
}

async function mark(kind,id,val){

async function loadSample(){
  const t=today(),docs=[];
  const C=[['s_c1','Ravi Kumar','Head coach','98100 00001',['c_stx']],['s_c2','Imran Khan','Assistant coach','98100 00002',['c_tulip']],['s_c3','Deepa Nair','Goalkeeping coach','98100 00003',['c_stx','c_tulip']]];
  C.forEach(c=>docs.push(['coaches/'+c[0],{name:c[1],role:c[2],phone:c[3],centerIds:c[4],sample:true}]));
  const B=[['s_b1','Under 10','c_stx',[1,3,5],'16:30',['s_c1','s_c3']],['s_b2','Under 13','c_stx',[2,4,6],'17:30',['s_c1']],['s_b3','Under 16','c_tulip',[1,2,4,5],'18:30',['s_c2']],['s_b4','Under 10','c_tulip',[2,4,6],'16:30',['s_c2','s_c3']]];
  B.forEach(b=>docs.push(['batches/'+b[0],{name:b[1],centerId:b[2],days:b[3],time:b[4],coachIds:b[5],sample:true}]));
  const N=['Aarav Sharma','Vihaan Yadav','Reyansh Gupta','Kabir Singh','Arjun Mehta','Ishaan Verma','Dev Malhotra','Rohan Chauhan','Atharv Joshi','Krish Bansal','Neil Fernandes','Zayan Ali','Samar Dahiya','Veer Rathi','Aditya Kapoor','Yuvraj Tanwar','Ayaan Siddiqui','Laksh Choudhary'];
  const back=[5,35,75,100,20,170,260,330,12,60,95,140,25,185,300,8,45,110],price={3:6000,6:11000,12:20000};
  const students=N.map((n,i)=>{const b=B[i%4];return {id:'s_st'+(i+1),name:n,batchId:b[0],centerId:b[2],dob:(2026-(9+(i%3)*3+(i%2)))+'-0'+(1+i%9)+'-1'+(i%9),guardian:'Parent of '+n.split(' ')[0],phone:'98765 '+pad(10+i)+'0'+pad(20+i),joined:addDays(t,-back[i]),status:'active'}});
  let pn=0;
  students.forEach((s,i)=>{
    const m=PLANS[i%3],start=addDays(t,-back[i]),fee=price[m];
    docs.push(['students/'+s.id,Object.assign({},s,{id:undefined,sample:true})]);
    docs.push(['plans/s_pl'+(i+1),{studentId:s.id,months:m,start,fee,sample:true}]);
    const pay=(amt,off,note)=>docs.push(['payments/s_p'+(pn++),{studentId:s.id,planId:'s_pl'+(i+1),amount:amt,date:addDays(start,off),mode:['UPI','Cash','UPI'][i%3],note,sample:true}]);
    if(i%4===0)pay(fee,1,'');
    else if(i%4===1)pay(Math.round(fee/2),2,'Installment 1');
    else if(i%4===2){pay(Math.round(fee/2),1,'Installment 1');pay(fee-Math.round(fee/2),Math.min(30,back[i]),'Installment 2')}
  });
  for(let d=1;d<=7;d++){
    const ds=addDays(t,-d),rec={};
    students.forEach((s,i)=>{const v=(i*7+d*3)%11;rec[s.id]=v===0||v===5?'A':v===3?'L':'P'});
    docs.push(['attendance/'+ds,{records:rec,sample:true}]);
    CENTERS.forEach(c=>{const crec={};C.filter(x=>x[4].includes(c.id)).forEach((x,i)=>{crec[x[0]]=(i+d)%6===0?'A':'P'});docs.push(['coachAttendance/'+ds+'_'+c.id,{records:crec,sample:true}])});
  }
  toast('Loading sample data…');
  const ok=await save(async()=>{for(const [p,d] of docs){const c={};for(const k in d)if(d[k]!==undefined)c[k]=d[k];await db.doc(p).set(c)}});
  if(ok)toast('Sample data loaded');
}

        else if(k==='coach'){ok=await delDoc('coaches',id);for(const b of S.batches.filter(b=>(b.coachIds||[]).includes(id)))await putDoc('batches',b.id,Object.assign({},b,{id:undefined,coachIds:b.coachIds.filter(x=>x!==id)}))}
        if(ok){closeSheet();toast('Deleted')}
      })();
      break}
  }
});

function makeSnapshotRow(row){return {id:row.id,data:()=>({...row.data})}}
function makeDbAdapter(client){
  function splitPath(path){const bits=String(path).split('/').filter(Boolean);if(bits.length!==2)throw new Error('Invalid record path: '+path);return {collection:bits[0],id:bits[1]}}
  function docRef(path){
    const {collection,id}=splitPath(path);
    const query=()=>client.from('academy_documents').select('id,data').eq('collection',collection).eq('id',id).maybeSingle();
    return {
      id,
      async get(){const {data,error}=await query();if(error)throw error;return {id,exists:!!data,data:()=>data?({...data.data}):undefined}},
      async set(value){const {error}=await client.from('academy_documents').upsert({collection,id,data:value||{},updated_at:new Date().toISOString()},{onConflict:'collection,id'});if(error)throw error},
      async update(patch){const snap=await this.get();if(!snap.exists)throw new Error('Record does not exist');const merged={...snap.data(),...(patch||{})};const {error}=await client.from('academy_documents').update({data:merged,updated_at:new Date().toISOString()}).eq('collection',collection).eq('id',id);if(error)throw error},
      async delete(){const {error}=await client.from('academy_documents').delete().eq('collection',collection).eq('id',id);if(error)throw error},
      onSnapshot(next,errorCallback){
        let alive=true;
        const refresh=async()=>{try{const snap=await docRef(path).get();if(alive)next(snap)}catch(e){if(alive&&errorCallback)errorCallback(e)}};
        const channel=client.channel('academy-doc-'+collection+'-'+id+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'academy_documents',filter:'collection=eq.'+collection},payload=>{if(payload.new?.id===id||payload.old?.id===id)refresh()}).subscribe();
        activeChannels.add(channel);refresh();
        return {unsubscribe(){alive=false;activeChannels.delete(channel);client.removeChannel(channel)}};
      }
    };
  }
  return {
    doc:docRef,
    collection(name){return {
      doc(id){return docRef(name+'/'+(id||((crypto&&crypto.randomUUID)?crypto.randomUUID():('ad_'+Date.now().toString(36)+Math.random().toString(36).slice(2)))) )},
      onSnapshot(next,errorCallback){
        let alive=true;
        const refresh=async()=>{try{const {data,error}=await client.from('academy_documents').select('id,data').eq('collection',name);if(error)throw error;const snap={docs:(data||[]).map(makeSnapshotRow)};if(alive)next(snap)}catch(e){if(alive&&errorCallback)errorCallback(e)}};
        const channel=client.channel('academy-coll-'+name+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'academy_documents',filter:'collection=eq.'+name},()=>refresh()).subscribe();
        activeChannels.add(channel);refresh();
        return {unsubscribe(){alive=false;activeChannels.delete(channel);client.removeChannel(channel)}};
      }
    }}
  };
}

async function activateSession(session){
  if(!session?.user){currentUser=null;currentRole=null;db=null;authReady=true;S.ready=true;render();return}
  const {data:member,error}=await sb.from('academy_members').select('role,coach_id').eq('user_id',session.user.id).maybeSingle();
  if(error||!member){
    await sb.auth.signOut();currentUser=null;currentRole=null;db=null;authReady=true;S.ready=true;
    authMessage=error?'Could not verify academy access: '+error.message:'This account is not authorised for Academy Desk. Ask an administrator to add it to academy_members.';
    render();return;
  }
  if(!['admin','coach'].includes(member.role)){
    await sb.auth.signOut();currentUser=null;currentRole=null;currentCoachId=null;db=null;authReady=true;S.ready=true;
    authMessage='This account has an unsupported Academy Desk role. Ask an administrator to verify its access.';
    render();return;
  }
    currentUser=session.user;currentRole=member.role;currentCoachId=member.coach_id||null;
  if(currentRole==='coach'&&!currentCoachId){await sb.auth.signOut();currentUser=null;currentRole=null;currentCoachId=null;db=null;authReady=true;S.ready=true;authMessage='This coach account is not linked to a coach profile yet. Ask the administrator to finish account setup.';render();return}
  authMessage='';
  db=makeDbAdapter(sb);S.ready=false;S.dbOk=true;S.loaded={};
  authReady=true;startSubs();render();
}
